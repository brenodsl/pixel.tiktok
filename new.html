<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Ads - Fingerprint Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-card { transition: all 0.3s ease; }
        .loading { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

    <div class="container mx-auto px-4 py-10">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-blue-500 mb-2">Elite Ads Contingência</h1>
            <p class="text-slate-400">Verificador de Integridade de Perfil (Fingerprint.com API)</p>
        </header>

        <div class="max-w-4xl mx-auto">
            <div id="main-status" class="status-card bg-slate-800 border border-slate-700 rounded-xl p-8 mb-6 text-center">
                <div id="loader" class="text-xl">Iniciando escaneamento de hardware...</div>
                <div id="results" class="hidden">
                    <h2 class="text-2xl font-semibold mb-4 text-slate-300">ID ÚNICO DO DISPOSITIVO:</h2>
                    <div id="visitor-id" class="text-3xl font-mono text-yellow-400 break-all mb-4">---</div>
                    <div id="score-badge" class="inline-block px-6 py-2 rounded-full text-sm font-bold uppercase tracking-widest">
                        Analisando Score...
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-800 p-5 rounded-lg border border-slate-700">
                    <h3 class="text-blue-400 font-bold mb-3 border-b border-slate-700 pb-2">🌐 Conexão e IP</h3>
                    <ul id="network-data" class="space-y-2 text-sm text-slate-300">
                        <li>Aguardando dados...</li>
                    </ul>
                </div>

                <div class="bg-slate-800 p-5 rounded-lg border border-slate-700">
                    <h3 class="text-blue-400 font-bold mb-3 border-b border-slate-700 pb-2">💻 Hardware & Browser</h3>
                    <ul id="hardware-data" class="space-y-2 text-sm text-slate-300">
                        <li>Aguardando dados...</li>
                    </ul>
                </div>
            </div>

            <div class="mt-8 text-center">
                <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold transition">
                    REPETIR TESTE
                </button>
            </div>
        </div>
    </div>

    <script>
      const fpPromise = import('https://fpjscdn.net/v3/VSirM0UGucG5OTdlJdXY')
        .then(FingerprintJS => FingerprintJS.load())

      fpPromise
        .then(fp => fp.get({extendedResult: true}))
        .then(result => {
          document.getElementById('loader').classList.add('hidden');
          document.getElementById('results').classList.remove('hidden');

          // Exibe VisitorID
          document.getElementById('visitor-id').innerText = result.visitorId;

          // Lógica de Score de Confiança (Mock based on extended results)
          const badge = document.getElementById('score-badge');
          if (result.incognito) {
              badge.innerText = "ALTO RISCO: NAVEGADOR INCÓGNITO";
              badge.classList.add('bg-red-500', 'text-white');
          } else {
              badge.innerText = "SCORE DE CONFIANÇA ACEITÁVEL";
              badge.classList.add('bg-green-500', 'text-white');
          }

          // Dados de Rede
          document.getElementById('network-data').innerHTML = `
              <li><strong>IP:</strong> ${result.ip}</li>
              <li><strong>Cidade:</strong> ${result.ipLocation?.city?.name || 'N/A'}</li>
              <li><strong>Provedor (ISP):</strong> ${result.ipLocation?.subdivisions?.[0]?.name || 'N/A'}</li>
              <li><strong>VPN/Proxy:</strong> ${result.proxy ? '⚠️ Detectado' : '✅ Limpo'}</li>
          `;

          // Dados de Hardware
          document.getElementById('hardware-data').innerHTML = `
              <li><strong>OS:</strong> ${result.os} ${result.osVersion}</li>
              <li><strong>Browser:</strong> ${result.browserName}</li>
              <li><strong>User Agent:</strong> <span class="text-xs break-all">${navigator.userAgent}</span></li>
              <li><strong>Fuso Horário:</strong> ${result.timezone}</li>
          `;
          
          console.log("Dados Completos:", result);
        })
        .catch(error => {
          document.getElementById('loader').innerHTML = `<span class="text-red-500">Erro: ${error.message}</span>`;
          console.error(error);
        })
    </script>
</body>
</html>
