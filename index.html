<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ads Manager - Hub de Contingência</title>
    <style>
        :root {
            --primary: #00f2ea;
            --secondary: #ff0050;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--accent);
        }

        h2 { 
            margin-top: 0; 
            font-size: 1.3rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group { margin-bottom: 15px; text-align: left; }
        
        input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary); color: #000; width: 100%; }
        .btn-secondary { background: var(--accent); color: white; padding: 8px 12px; }
        .btn-success { background: #22c55e; color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); width: 100%; }

        .data-row {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
        }

        .data-label { font-size: 0.7rem; color: #94a3b8; display: block; }
        .data-content { font-family: monospace; font-size: 0.9rem; word-break: break-all; padding-right: 10px; }

        .pixel-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        .status-badge {
            font-size: 0.75rem; padding: 4px 12px; border-radius: 20px;
            background: #334155; margin-bottom: 15px; display: inline-block;
        }

        #cookie-progress {
            font-size: 0.8rem; margin-top: 10px; color: var(--secondary); font-weight: bold;
        }

        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } }
    </style>
</head>
<body onload="init()">

    <div class="dashboard">
        
        <div class="flex-col">
            <div class="card" style="margin-bottom: 20px;">
                <h2>🍪 Aquecimento Inteligente</h2>
                <div class="input-group">
                    <label class="data-label">QTD SITES (MAX 30)</label>
                    <input type="number" id="cookie-qty" value="15" max="30">
                </div>
                <button class="btn-outline" id="btn-cookies" onclick="aquecerCookiesTemporizado()">🔥 Iniciar Fluxo de Aquecimento</button>
                <div id="cookie-progress"></div>
            </div>

            <div class="card">
                <h2>🏢 Dados Reais (Mantidos)</h2>
                <div id="status-ip" class="status-badge">Detectando IP...</div>
                
                <div id="loader" style="display:none; color: var(--primary); font-size: 0.8rem;">Buscando na Receita...</div>

                <div id="area-dados">
                    <div class="data-row">
                        <div><span class="data-label">RAZÃO SOCIAL</span><div class="data-content" id="f-razao">...</div></div>
                        <button class="btn-secondary" onclick="copy('f-razao')">Copiar</button>
                    </div>
                    <div class="data-row">
                        <div><span class="data-label">CNPJ</span><div class="data-content" id="f-cnpj">...</div></div>
                        <button class="btn-secondary" onclick="copy('f-cnpj')">Copiar</button>
                    </div>
                    <div class="data-row">
                        <div><span class="data-label">ENDEREÇO (RUA, NUM, BAIRRO)</span><div class="data-content" id="f-endereco-full">...</div></div>
                        <button class="btn-secondary" onclick="copy('f-endereco-full')">Copiar</button>
                    </div>
                    <div class="data-row">
                        <div><span class="data-label">CEP</span><div class="data-content" id="f-cep">...</div></div>
                        <button class="btn-secondary" onclick="copy('f-cep')">Copiar</button>
                    </div>
                    <div class="data-row">
                        <div><span class="data-label">CIDADE / UF</span><div class="data-content" id="f-cidade-cep">...</div></div>
                        <button class="btn-secondary" onclick="copy('f-cidade-cep')">Copiar</button>
                    </div>
                    <div class="data-row">
                        <div><span class="data-label">WHATSAPP (TELEFONE)</span><div class="data-content" id="f-tel">...</div></div>
                        <button class="btn-secondary" onclick="copy('f-tel')">Copiar</button>
                    </div>
                </div>
                <button class="btn-primary" style="margin-top: 15px;" onclick="buscarEmpresaReal()">Gerar Novos Dados</button>
            </div>
        </div>

        <div class="card">
            <h2>🎯 Pixel TikTok (Sem Refresh)</h2>
            <div class="input-group">
                <input type="text" id="pixel-id" placeholder="Digite o ID do Pixel">
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn-success" style="flex:1" onclick="ativarPixelSemReiniciar()">Ativar Pixel</button>
                <button id="toggle-auto-mode" class="btn-outline" style="flex:1">Auto Mode</button>
            </div>

            <div class="pixel-grid">
                <button class="btn-secondary" onclick="trackEvent('ViewContent')">View Content</button>
                <button class="btn-secondary" onclick="trackEvent('AddToCart')">Add to Cart</button>
                <button class="btn-secondary" onclick="trackEvent('InitiateCheckout')">Checkout</button>
                <button class="btn-secondary" onclick="trackEvent('AddPaymentInfo')">Add Payment</button>
                <button class="btn-secondary" onclick="trackEvent('CompleteRegistration')">Registration</button>
                <button class="btn-primary" onclick="trackEvent('Purchase', 197)">PURCHASE</button>
            </div>
            <div id="pixel-status" style="margin-top: 15px; font-size: 0.8rem; color: #64748b; text-align: center;">Pixel Inativo</div>
        </div>

    </div>

    <script>
        const listaSites = ["https://www.g1.globo.com", "https://www.uol.com.br", "https://www.mercadolivre.com.br", "https://www.amazon.com.br", "https://www.magazineluiza.com.br", "https://www.americanas.com.br", "https://www.casasbahia.com.br", "https://www.netshoes.com.br", "https://www.olx.com.br", "https://www.booking.com", "https://www.extra.com.br", "https://www.submarino.com.br", "https://www.ponto.com.br", "https://www.shopee.com.br", "https://www.havan.com.br", "https://www.r7.com", "https://www.kabum.com.br", "https://www.enjoei.com.br", "https://www.dafiti.com.br", "https://www.zattini.com.br"];
        
        let dddLocal = "11";
        let autoMode = false;
        let autoInterval;

        function init() {
            detectarLocalizacao();
        }

        // --- SOLUÇÃO PARA NÃO REINICIAR A PÁGINA ---
        function ativarPixelSemReiniciar() {
            const id = document.getElementById('pixel-id').value;
            if (!id) return alert("Insira o ID do Pixel");
            
            // Injeta o script sem dar reload
            if (!window.ttq) {
                injectTikTokScript(id);
            } else {
                // Se o script já existe, apenas carrega o novo ID
                ttq.load(id);
                ttq.page();
            }
            document.getElementById('pixel-status').innerText = "✅ Pixel " + id + " ativo nos dados atuais!";
            document.getElementById('pixel-status').style.color = var(--primary);
        }

        function injectTikTokScript(id) {
            !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.load=function(e){var n=document.createElement("script");n.type="text/javascript",n.async=!0,n.src="https://analytics.tiktok.com/i18n/pixel/events.js?sdkid="+e+"&lib="+t;var r=document.getElementsByTagName("script")[0];r.parentNode.insertBefore(n,r)};
            ttq.load(id); ttq.page();
            }(window,document,'ttq');
        }

        // --- MELHORIA DOS COOKIES (TEMPORIZADO) ---
        async function aquecerCookiesTemporizado() {
            const qty = document.getElementById('cookie-qty').value;
            const selecionados = [...listaSites].sort(() => 0.5 - Math.random()).slice(0, qty);
            const btn = document.getElementById('btn-cookies');
            const progresso = document.getElementById('cookie-progress');
            
            btn.disabled = true;
            btn.innerText = "⏳ Aquecendo...";

            for (let i = 0; i < selecionados.length; i++) {
                progresso.innerText = `Abrindo site ${i + 1} de ${selecionados.length}...`;
                window.open(selecionados[i], '_blank');
                // Espera 5 segundos antes de abrir o próximo
                await new Promise(resolve => setTimeout(resolve, 5000));
            }

            progresso.innerText = "✅ Aquecimento Concluído!";
            btn.disabled = false;
            btn.innerText = "🔥 Iniciar Fluxo de Aquecimento";
        }

        // --- BUSCA DE DADOS ---
        async function detectarLocalizacao() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const dddMap = {"SP":"11","RJ":"21","MG":"31","PR":"41","RS":"51","SC":"48","BA":"71","PE":"81","CE":"85","DF":"61"};
                dddLocal = dddMap[data.region_code] || "11";
                document.getElementById('status-ip').innerText = `📍 ${data.city}, ${data.region_code}`;
                buscarEmpresaReal();
            } catch (e) { console.log("Erro IP"); }
        }

        async function buscarEmpresaReal() {
            document.getElementById('loader').style.display = 'block';
            try {
                const randomPrefix = Math.floor(Math.random() * 70000000) + 10000000;
                const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${randomPrefix}000100`);
                const data = await res.json();

                if (data.cnpj) {
                    document.getElementById('f-razao').innerText = data.razao_social;
                    document.getElementById('f-cnpj').innerText = data.cnpj;
                    document.getElementById('f-endereco-full').innerText = `${data.logradouro}, ${data.numero}, ${data.bairro}`;
                    document.getElementById('f-cep').innerText = data.cep;
                    document.getElementById('f-cidade-cep').innerText = `${data.municipio} / ${data.uf}`;
                    document.getElementById('f-tel').innerText = data.ddd_telefone_1 || (dddLocal + "9" + Math.floor(10000000 + Math.random() * 90000000));
                } else { buscarEmpresaReal(); }
            } catch (e) { buscarEmpresaReal(); }
            document.getElementById('loader').style.display = 'none';
        }

        function trackEvent(ev, val=0) {
            if(window.ttq) {
                ttq.track(ev, { value: val, currency: 'BRL' });
                alert(`Evento ${ev} disparado!`);
            } else { alert("Ative o Pixel primeiro!"); }
        }

        function copy(id) {
            const txt = document.getElementById(id).innerText;
            navigator.clipboard.writeText(txt);
            const btn = window.event.target;
            btn.innerText = "OK!";
            setTimeout(() => btn.innerText = "Copiar", 800);
        }

        document.getElementById('toggle-auto-mode').onclick = function() {
            autoMode = !autoMode;
            if(autoMode) {
                this.className = "btn-success";
                this.innerText = "ON";
                autoInterval = setInterval(() => {
                    const evs = ["ViewContent", "AddToCart", "InitiateCheckout"];
                    trackEvent(evs[Math.floor(Math.random()*evs.length)]);
                }, 7000);
            } else {
                this.className = "btn-outline";
                this.innerText = "Auto Mode";
                clearInterval(autoInterval);
            }
        };
    </script>
</body>
</html>
