<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ads Manager Pro - V3 (Com CEP)</title>
    <style>
        :root {
            --primary: #00f2ea;
            --secondary: #ff0050;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--accent);
        }

        h2 { color: var(--primary); margin-top: 0; font-size: 1.2rem; }
        
        input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: white;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: 0.2s;
            width: 100%;
            margin-bottom: 5px;
        }

        .btn-primary { background: var(--primary); color: #000; }
        .btn-success { background: #22c55e; color: white; }
        .btn-secondary { background: var(--accent); color: white; width: auto; padding: 5px 10px; font-size: 0.8rem; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        .data-row {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--primary);
        }

        .data-label { font-size: 0.65rem; color: #94a3b8; display: block; margin-bottom: 2px; }
        .data-content { font-family: monospace; font-size: 0.85rem; }
        .pixel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #status-ip { color: var(--secondary); font-size: 0.8rem; margin-bottom: 10px; font-weight: bold; }
        #cookie-progress { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; }

        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="flex-col">
            <div class="card" style="margin-bottom: 20px;">
                <h2>🍪 Aquecer Navegador</h2>
                <input type="number" id="cookie-qty" value="5" placeholder="Qtd sites">
                <button class="btn-outline" onclick="aquecerCookies()">🔥 Abrir Sites (Intervalo 5s)</button>
                <div id="cookie-progress">Aguardando comando...</div>
            </div>

            <div class="card">
                <h2>🏢 Dados da Empresa</h2>
                <div id="status-ip">Localizando IP...</div>
                <div id="area-dados">
                    <div class="data-row"><div><span class="data-label">RAZÃO SOCIAL</span><span id="f-razao">...</span></div><button class="btn-secondary" onclick="copy('f-razao')">Copiar</button></div>
                    <div class="data-row"><div><span class="data-label">CNPJ</span><span id="f-cnpj">...</span></div><button class="btn-secondary" onclick="copy('f-cnpj')">Copiar</button></div>
                    <div class="data-row"><div><span class="data-label">ENDEREÇO (RUA, Nº, BAIRRO)</span><span id="f-endereco-full">...</span></div><button class="btn-secondary" onclick="copy('f-endereco-full')">Copiar</button></div>
                    <div class="data-row"><div><span class="data-label">CEP</span><span id="f-cep">...</span></div><button class="btn-secondary" onclick="copy('f-cep')">Copiar</button></div>
                    <div class="data-row"><div><span class="data-label">WHATSAPP</span><span id="f-tel">...</span></div><button class="btn-secondary" onclick="copy('f-tel')">Copiar</button></div>
                </div>
                <button class="btn-primary" onclick="buscarEmpresaReal()">Gerar Novos Dados</button>
                <button class="btn-outline" onclick="copiarTudo()">📋 Copiar TODAS as Informações</button>
            </div>
        </div>

        <div class="card">
            <h2>🎯 Pixel TikTok</h2>
            <input type="text" id="pixel-id" placeholder="ID do Pixel">
            <button class="btn-success" onclick="ativarPixel()">1. Ativar Pixel</button>
            <div class="pixel-grid">
                <button class="btn-secondary" onclick="trackEvent('ViewContent')">View Content</button>
                <button class="btn-secondary" onclick="trackEvent('AddToCart')">Add to Cart</button>
                <button class="btn-secondary" onclick="trackEvent('InitiateCheckout')">Checkout</button>
                <button class="btn-primary" onclick="trackEvent('Purchase', 197)">PURCHASE</button>
            </div>
            <p id="pixel-log" style="font-size: 0.7rem; color: #64748b; margin-top: 10px;">Status: Off</p>
        </div>
    </div>

    <script>
        const sites = ["https://www.google.com", "https://www.mercadolivre.com.br", "https://www.uol.com.br", "https://www.g1.globo.com", "https://www.amazon.com.br", "https://www.americanas.com.br", "https://www.magazineluiza.com.br", "https://www.youtube.com", "https://www.shopee.com.br"];
        let dddGlobal = "11";

        async function init() {
            try {
                const r = await fetch('https://ipwho.is/');
                const d = await r.json();
                if(d.success) {
                    document.getElementById('status-ip').innerText = `📍 ${d.city}/${d.region_code} - IP: ${d.ip}`;
                    dddGlobal = d.calling_code || "11"; 
                    buscarEmpresaReal();
                }
            } catch(e) { 
                document.getElementById('status-ip').innerText = "Erro ao carregar IP.";
                buscarEmpresaReal();
            }
        }

        function copiarTudo() {
            const dados = {
                razao: document.getElementById('f-razao').innerText,
                cnpj: document.getElementById('f-cnpj').innerText,
                endereco: document.getElementById('f-endereco-full').innerText,
                cep: document.getElementById('f-cep').innerText,
                whatsapp: document.getElementById('f-tel').innerText,
                pixel: document.getElementById('pixel-id').value || "Não informado"
            };
        
            const textoBackup =
`PIXEL TIKTOK:${dados.pixel}
RAZÃO SOCIAL:${dados.razao}
CNPJ:${dados.cnpj}
ENDEREÇO:${dados.endereco}
CEP:${dados.cep}
WHATSAPP:${dados.whatsapp}
DATA:${new Date().toLocaleString()}`;
        
            navigator.clipboard.writeText(textoBackup).then(() => {
                alert("✅ Todas as informações foram copiadas com sucesso!");
            });
        }

        async function buscarEmpresaReal() {
            document.getElementById('f-razao').innerText = "Buscando...";
            try {
                // Semente de CNPJ aleatória
                const rando = Math.floor(Math.random() * 50000000) + 10000000;
                const r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${rando}000100`);
                const d = await r.json();
                
                if(d.cnpj) {
                    document.getElementById('f-razao').innerText = d.razao_social;
                    document.getElementById('f-cnpj').innerText = d.cnpj;
                    document.getElementById('f-endereco-full').innerText = `${d.logradouro}, ${d.numero}, ${d.bairro}`;
                    document.getElementById('f-cep').innerText = d.cep;
                    document.getElementById('f-tel').innerText = d.ddd_telefone_1 || (dddGlobal + "9" + Math.floor(Math.random()*90000000 + 10000000));
                } else { buscarEmpresaReal(); }
            } catch(e) { buscarEmpresaReal(); }
        }

        async function aquecerCookies() {
            const qty = document.getElementById('cookie-qty').value;
            const progress = document.getElementById('cookie-progress');
            const lista = [...sites].sort(() => 0.5 - Math.random()).slice(0, qty);
            
            alert("Clique em OK e aceite os pop-ups no topo do navegador.");

            for(let i=0; i < lista.length; i++) {
                progress.innerText = `Abrindo ${i+1} de ${lista.length}...`;
                window.open(lista[i], '_blank');
                await new Promise(res => setTimeout(res, 5000));
            }
            progress.innerText = "✅ Concluído!";
        }

        function ativarPixel() {
            const id = document.getElementById('pixel-id').value;
            if (!id) {
                alert("Por favor, insira o ID do Pixel.");
                return;
            }
        
            if (!window.ttq) {
                !function (w, d, t) {
                    w.TiktokAnalyticsObject = t;
                    var ttq = w[t] = w[t] || [];
                    ttq.methods = ["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"];
                    ttq.setAndDefer = function (t, e) {
                        t[e] = function () {
                            t.push([e].concat(Array.prototype.slice.call(arguments, 0)));
                        }
                    };
                    for (var i = 0; i < ttq.methods.length; i++) {
                        ttq.setAndDefer(ttq, ttq.methods[i]);
                    }
                    ttq.load = function (e) {
                        var n = d.createElement("script");
                        n.type = "text/javascript";
                        n.async = true;
                        n.src = "https://analytics.tiktok.com/i18n/pixel/events.js?sdkid=" + e + "&lib=" + t;
                        var r = d.getElementsByTagName("script")[0];
                        r.parentNode.insertBefore(n, r);
                    };
                    ttq.load(id);
                    ttq.page();
                }(window, document, 'ttq');
            }
        
            document.getElementById('pixel-log').innerText =
                `✅ Pixel ${id} Ativado nos dados atuais!`;
            document.getElementById('pixel-log').style.color = "#00f2ea";
        }

        function trackEvent(name, val=0) {
            if(window.ttq) {
                ttq.track(name, { value: val, currency: 'BRL' });
                document.getElementById('pixel-log').innerText = `🚀 Evento ${name} enviado!`;
            } else { alert("Ative o pixel primeiro!"); }
        }

        function copy(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            const btn = window.event.target;
            const original = btn.innerText;
            btn.innerText = "OK!";
            setTimeout(() => btn.innerText = original, 800);
        }

        window.onload = init;
    </script>
</body>
</html>
